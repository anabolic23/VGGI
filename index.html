<body onload="init()">

<h2>A Cube with "Trackball" Mouse Rotation</h2>

<p id="message">Drag your mouse on the cube to rotate it.<br>
(On a touch screen, you can use your finger.)</p>

<div style="margin-bottom: 10px;">
  <label for="sliderR">Granularity U (dr): </label>
  <input type="range" id="sliderR" min="0.05" max="0.5" step="0.01" value="0.1">
  <span id="valR">0.1</span>

  <br>

  <label for="sliderTheta">Granularity V (dTheta): </label>
  <input type="range" id="sliderTheta" min="0.1" max="1.0" step="0.05" value="0.2">
  <span id="valTheta">0.2</span>
</div>

<div id="canvas-holder">
   <canvas width="600" height="600" id="webglcanvas" style="background-color:red"></canvas>
</div>
