<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PA#4 — Texture Transformations</title>
  <style>
    body { background: #EEE; font-family: sans-serif; }
    #controls { margin: 8px 0; }
    canvas { background: #222; display:block; margin: 0 auto; }
    .control-group { margin: 10px 0; }
    .texture-info { 
        background: #f0f0f0; 
        padding: 10px; 
        margin: 10px 0; 
        border-radius: 5px;
    }
    .instructions {
        background: #e0e0ff;
        padding: 10px;
        margin: 10px 0;
        border-radius: 5px;
        border-left: 4px solid #6666ff;
    }
  </style>
</head>
<body onload="init()">

<h2>PA#4 — Texture Scaling with Pivot Point</h2>

<div class="instructions">
  <strong>Controls:</strong><br>
  • <strong>W/S</strong> - Move pivot point up/down (V axis)<br>
  • <strong>A/D</strong> - Move pivot point left/right (U axis)<br>
  • <strong>Q/E</strong> - Scale texture up/down<br>
  • <strong>R</strong> - Reset transformations<br>
  • <strong>Mouse Drag</strong> - Rotate view
</div>

<div class="texture-info">
  <strong>Texture Info:</strong> 
  Current Scale: <span id="scaleValue">1.00</span> | 
  Pivot: [<span id="pivotU">0.50</span>, <span id="pivotV">0.50</span>]
</div>

<div id="controls">
  <div class="control-group">
    <label>Granularity U (dr):
      <input id="sliderR" type="range" min="0.05" max="0.5" step="0.01" value="0.1">
      <span id="valR">0.10</span>
    </label>
  </div>
  <div class="control-group">
    <label>Granularity V (dTheta):
      <input id="sliderTheta" type="range" min="0.1" max="1.0" step="0.05" value="0.2">
      <span id="valTheta">0.20</span>
    </label>
  </div>
  <div class="control-group">
    <label>rMin:
      <input id="rMin" type="number" min="0.1" max="0.9" step="0.05" value="0.25">
    </label>
    <label>rMax:
      <input id="rMax" type="number" min="1.0" max="3.0" step="0.1" value="1.0">
    </label>
    <button onclick="updateSurface()">Update Surface</button>
  </div>
</div>

<div id="canvas-holder">
  <canvas id="webglcanvas" width="700" height="700"></canvas>
</div>

<!-- utilities from lecture -->
<script src="./Utils/trackball-rotator.js"></script>
<script src="./Utils/m4.js"></script>

<!-- app files -->
<script src="./shader.gpu"></script>
<script src="./TextureHandler.js"></script>
<script src="./Model.js"></script>
<script src="./main.js"></script>

<script>
function updateSurface() {
    window.rMin = parseFloat(document.getElementById('rMin').value);
    window.rMax = parseFloat(document.getElementById('rMax').value);
    
    const dr = parseFloat(document.getElementById('sliderR').value);
    const dTheta = parseFloat(document.getElementById('sliderTheta').value);
    
    const data = {};
    CreateSurfaceData(data, dr, dTheta);
    
    surface.BufferData(data.verticesF32, data.normalsF32, data.tangentsF32, data.texcoordsF32, data.indicesU16);
    draw();
}

// Function to update UI display
function updateTextureInfo() {
    document.getElementById('scaleValue').textContent = textureScale.toFixed(2);
    document.getElementById('pivotU').textContent = texturePivot[0].toFixed(2);
    document.getElementById('pivotV').textContent = texturePivot[1].toFixed(2);
}

// Initialize slider values
document.getElementById('sliderR').addEventListener('input', function(e) {
    document.getElementById('valR').textContent = e.target.value;
    updateSurface();
});

document.getElementById('sliderTheta').addEventListener('input', function(e) {
    document.getElementById('valTheta').textContent = e.target.value;
    updateSurface();
});

// Update texture info periodically
setInterval(updateTextureInfo, 100);

window.rMin = 0.25;
window.rMax = 1.0;
</script>

</body>
</html>
